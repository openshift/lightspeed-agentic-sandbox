[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightspeed-agentic"
version = "0.1.0"
description = "Multi-provider agentic sandbox for OpenShift Lightspeed"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "opentelemetry-api>=1.33.0",
    "opentelemetry-sdk>=1.33.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.33.0",
    "opentelemetry-exporter-otlp-proto-http>=1.33.0",
    "prometheus-client>=0.22.0",
    "kubernetes>=32.0.0",
]

[project.optional-dependencies]
deepagents = [
    "deepagents>=0.6.12",
    "langchain-anthropic>=1.4.8",
    "langchain-google-vertexai>=3.2.4",
    "langchain-aws>=1.6.2",
    "langchain-mcp-adapters>=0.3.0",
]
gemini = ["google-adk>=1.33.0"]
openai = ["openai-agents>=0.17.2"]
all = ["lightspeed-agentic[deepagents,gemini,openai]"]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "mypy>=1.20.2",
    "ruff>=0.15.12",
    "lightspeed-agentic[deepagents,gemini,openai]",
]
e2e = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-bdd>=8.1.0",
    "pytest-timeout>=2.4.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "kubernetes>=32.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lightspeed_agentic"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ARG", "ASYNC", "B", "E", "F", "I", "N", "PT", "RUF", "S", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tests/e2e/**/*.py" = ["S101", "I001", "F401"]
"scripts/**/*.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
