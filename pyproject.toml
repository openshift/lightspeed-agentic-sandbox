[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightspeed-agentic"
version = "0.1.0"
description = "Multi-provider agentic sandbox for OpenShift Lightspeed"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic==2.13.4",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.33.0",
    "opentelemetry-sdk>=1.33.0",
    "opentelemetry-exporter-otlp-proto-common>=1.33.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.33.0",
    "opentelemetry-exporter-otlp-proto-http>=1.33.0",
    "prometheus-client>=0.22.0",
    "protobuf>=5.0.0",
    "kubernetes>=32.0.0",
    "urllib3>=1.24.2,<3",
]

[project.optional-dependencies]
deepagents = [
    "anthropic<1",
    "botocore>=1.31.57,<2",
    "deepagents>=0.7.18",
    "google-auth>=2,<3",
    "jsonschema>=4.26.0",
    "referencing>=0.37.0",
    "langchain>=1.4.3,<2",
    "langchain-core>=1.6.6,<2",
    "langchain-anthropic>=1.4.8",
    "langchain-google-genai>=4.4.0",
    "langchain-google-vertexai>=3.2.5",
    "langchain-aws>=1.6.2",
    "langchain-mcp-adapters>=0.3.0",
]
openai = [
    "lightspeed-agentic[deepagents]",
    "openai>=2.45.0,<4",
    "azure-core>=1.31.0",
    "azure-identity>=1.21.0",
    "aiohttp<4",
    "langchain-openai>=1.7.2",
]
all = ["lightspeed-agentic[deepagents,openai]"]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-bdd>=8.1.0",
    "pytest-timeout>=2.4.0",
    "mypy>=1.20.2",
    "ruff>=0.15.12",
    "lightspeed-agentic[all]",
]
e2e = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-bdd>=8.1.0",
    "pytest-timeout>=2.4.0",
    "jsonschema>=4.26.0",
    "mcp>=1.24.0,<2",
    "starlette>=0.27.0",
    "uvicorn>=0.31.1",
]

[tool.uv]
constraint-dependencies = [
    "PyJWT>=2.14.0",
    "anyio>=4.14.2",
    "langgraph-sdk>=0.4.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lightspeed_agentic"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ARG", "ASYNC", "B", "E", "F", "I", "N", "PT", "RUF", "S", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tests/e2e/**/*.py" = ["S101", "I001", "F401"]
"scripts/**/*.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
