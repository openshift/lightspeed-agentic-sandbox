---
# Keep tekton.dev/v1beta1 for the git-resolved StepActions used by this pipeline.
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: sandbox-integration-test-pipeline
spec:
  description: |
    Runs sandbox batch BDD integration tests, including classifier-only corpus
    evaluation, for one provider configuration on a Konflux HyperShift hosted
    cluster. Installs e2e fixtures (Result CRDs, OTEL, RBAC), syncs LLM credential
    Secrets, then runs pytest against the SANDBOX_IMAGE from SNAPSHOT.

    Triggered per-provider by IntegrationTestScenario CRs:
      sandbox-integration-anthropic-vertex-deepagents,
      sandbox-integration-anthropic-bedrock-deepagents, openai-bedrock-mantle,
      sandbox-integration-gemini-vertex-adk,
      sandbox-integration-openai-agents,
      sandbox-integration-anthropic-deepagents,
      sandbox-integration-azure-openai-agents,
      sandbox-integration-azure-openai-entra-agents.
  params:
    - name: SNAPSHOT
      description: 'The JSON string representing the snapshot of the application under test.'
      default: '{"components": [{"name":"lightspeed-agentic-sandbox", "containerImage": "quay.io/example/repo:latest"}]}'
      type: string
    - name: provider
      description: 'E2E matrix id (anthropic-vertex-deepagents, anthropic-bedrock-deepagents, openai-bedrock-mantle, gemini-vertex-adk, openai-agents, anthropic-deepagents, azure-openai-agents).'
      type: string
    - name: credential-secret
      description: 'Name of the Konflux workspace secret containing provider credentials.'
      type: string
    - name: namespace
      description: 'Namespace for sandbox batch e2e fixtures and Jobs'
      default: 'openshift-lightspeed'
      type: string
    - name: openshift-version-prefix
      description: 'OpenShift minor version to provision (for example, 4.22).'
      default: '4.22'
      type: string
    - name: compute-node-type
      description: 'EC2 instance type for the ephemeral cluster compute nodes; m5.2xlarge = amd64, m6g.2xlarge = arm64.'
      type: string
      default: 'm5.2xlarge'
    - name: node-arch
      description: 'Compute node processor architecture; must match the compute-node-type instance family (m5* = amd64, m6g* = arm64).'
      type: string
      default: 'amd64'
  tasks:
    - name: validate-pipeline-params
      description: Reject params that cannot be safely embedded in the provisioning env JSON before provisioning starts.
      taskSpec:
        stepTemplate:
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          computeResources:
            limits:
              cpu: 100m
              memory: 128Mi
        steps:
          - name: validate-compute-node-type
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            env:
              - name: COMPUTE_NODE_TYPE
                value: $(params.compute-node-type)
            script: |
              #!/bin/sh
              # compute-node-type is substituted into the provision-ephemeral-cluster env JSON;
              # reject anything that is not a plain EC2 instance type so the JSON stays valid.
              # Use a whole-value case check (not grep): grep anchors apply per line, so a
              # value like 'm5.2xlarge\n"bad"' would pass and break the JSON.
              case "$COMPUTE_NODE_TYPE" in
                '')
                  echo "invalid compute-node-type: value is empty" >&2
                  exit 1
                  ;;
                *[!a-zA-Z0-9.-]*)
                  echo "invalid compute-node-type: '$COMPUTE_NODE_TYPE'" >&2
                  echo "must be a plain EC2 instance type (e.g. m5.2xlarge, m6g.2xlarge); quotes, spaces, newlines and special characters break the provisioning env JSON" >&2
                  exit 1
                  ;;
              esac
          - name: validate-node-arch
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            env:
              - name: NODE_ARCH
                value: $(params.node-arch)
              - name: COMPUTE_NODE_TYPE
                value: $(params.compute-node-type)
            script: |
              #!/bin/sh
              # node-arch is substituted into the provision-ephemeral-cluster env JSON;
              # only amd64/arm64 are supported by the hypershift-hostedcluster workflow.
              # Validate before provisioning so a bad value fails fast instead of
              # after a 2h cluster provisioning timeout.
              case "$NODE_ARCH" in
                amd64|arm64) ;;
                *)
                  echo "invalid node-arch: '$NODE_ARCH'" >&2
                  echo "must be amd64 or arm64 (HYPERSHIFT_NODE_ARCH of hypershift-hostedcluster-create-hostedcluster)" >&2
                  exit 1
                  ;;
              esac
              # Cross-check node-arch against the compute-node-type instance family.
              # An arch/instance mismatch (e.g. default amd64 with m6g.2xlarge Graviton
              # instances) creates a cluster whose nodes cannot boot the payload.
              FAMILY=$(printf '%s' "$COMPUTE_NODE_TYPE" | sed -E 's/\..*$//')
              case "$FAMILY" in
                # g5g instances are arm64 (Graviton2) GPU instances; check them
                # before the generic GPU branch below, which assumes x86_64.
                g5g*)
                  if [ "$NODE_ARCH" != "arm64" ]; then
                    echo "incompatible params: compute-node-type '$COMPUTE_NODE_TYPE' is an arm64 (Graviton2, g5g) GPU instance family but node-arch is '$NODE_ARCH'" >&2
                    echo "set node-arch: arm64 for this instance type" >&2
                    exit 1
                  fi
                  ;;
                # Graviton (arm64) families carry a 'g' after the leading letter
                # (m6g, c7gn, m6gd, t4g, r7gz, ...); GPU families (g*, p*) are x86_64.
                g*|p*)
                  if [ "$NODE_ARCH" != "amd64" ]; then
                    echo "incompatible params: compute-node-type '$COMPUTE_NODE_TYPE' looks like an x86_64 (GPU) instance family but node-arch is '$NODE_ARCH'" >&2
                    echo "set node-arch: amd64 for this instance type" >&2
                    exit 1
                  fi
                  ;;
                ?*g*)
                  if [ "$NODE_ARCH" != "arm64" ]; then
                    echo "incompatible params: compute-node-type '$COMPUTE_NODE_TYPE' is an arm64 (Graviton) instance family but node-arch is '$NODE_ARCH'" >&2
                    echo "set node-arch: arm64 for this instance type" >&2
                    exit 1
                  fi
                  ;;
                # Common x86_64 families
                m[0-9]*|c[0-9]*|r[0-9]*|t[0-9]*|x[0-9]*|z[0-9]*|i[0-9]*|d[0-9]*|h[0-9]*)
                  if [ "$NODE_ARCH" != "amd64" ]; then
                    echo "incompatible params: compute-node-type '$COMPUTE_NODE_TYPE' looks like an x86_64 instance family but node-arch is '$NODE_ARCH'" >&2
                    echo "set node-arch: amd64 for this instance type" >&2
                    exit 1
                  fi
                  ;;
                # Unknown family: do not block, preserve existing behavior.
                *)
                  echo "note: could not determine architecture of instance family '$FAMILY'; skipping arch cross-check" >&2
                  ;;
              esac
    - name: provision-ephemeral-cluster
      runAfter:
        - validate-pipeline-params
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: env
          value: '{"COMPUTE_NODE_TYPE": "$(params.compute-node-type)", "HYPERSHIFT_NODE_ARCH": "$(params.node-arch)", "HYPERSHIFT_NODE_COUNT": "3", "HOSTED_MANAGEMENT_CLUSTER": "hosted-mgmt2"}'
        - name: releases
          value: '{"latest":{"release":{"channel":"stable","version":"$(params.openshift-version-prefix)","architecture":"multi"}}}'
    - name: run-batch-e2e
      description: Install sandbox e2e fixtures and run the BDD suite, including classifier corpus evaluation.
      runAfter:
        - provision-ephemeral-cluster
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: provider
          value: $(params.provider)
        - name: credential-secret
          value: $(params.credential-secret)
        - name: namespace
          value: $(params.namespace)
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
      taskSpec:
        params:
          - name: SNAPSHOT
          - name: provider
            type: string
          - name: credential-secret
          - name: namespace
            type: string
          - name: clusterCredentialsSecretRef
            type: string
        results:
          - name: commit
            value: "$(steps.extract-commit.results.commit)"
          - name: artifact-reference
            value: "quay.io/openshift-lightspeed/ols-operator-artifacts:$(steps.extract-commit.results.artifact-tag)"
        volumes:
          - name: cluster-credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
          - name: credential
            secret:
              secretName: $(params.credential-secret)
          - name: trusted-ca
            configMap:
              name: trusted-ca
              items:
                - key: ca-bundle.crt
                  path: tls-ca-bundle.pem
          - name: ols-konflux-artifacts-bot-creds
            secret:
              secretName: ols-konflux-artifacts-bot
        steps:
          - name: extract-commit
            results:
              - name: commit
                type: string
              - name: artifact-tag
                type: string
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: PROVIDER
                value: $(params.provider)
              - name: PIPELINE_RUN_UID
                value: $(context.pipelineRun.uid)
            image: quay.io/konflux-qe-incubator/konflux-qe-tools:latest
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              COMMIT=$(echo "${SNAPSHOT}" | python3 -c "
              import json, sys
              try:
                  snap = json.load(sys.stdin)
                  matches = [c for c in snap['components'] if c['name'] == 'lightspeed-agentic-sandbox']
                  if not matches:
                      print('error: SNAPSHOT has no component named lightspeed-agentic-sandbox', file=sys.stderr)
                      sys.exit(1)
                  print(matches[0]['source']['git']['revision'])
              except (json.JSONDecodeError, KeyError, TypeError) as e:
                  print(f'error: failed to parse SNAPSHOT: {e}', file=sys.stderr)
                  sys.exit(1)
              ")
              echo "sandbox-integration commit=${COMMIT}"
              echo -n "${COMMIT}" > "$(step.results.commit.path)"
              ARTIFACT_TAG="ols-agentic-sandbox-integration-${PROVIDER}-${PIPELINE_RUN_UID}"
              printf '%s' "${ARTIFACT_TAG}" > "$(step.results.artifact-tag.path)"
          - name: run-tests
            # Continue to diagnostics even when pytest fails; the final
            # fail-if-any-step-failed step preserves the failure status.
            onError: continue
            resources:
              requests:
                memory: "4Gi"
              limits:
                memory: "8Gi"
            volumeMounts:
              - name: cluster-credentials
                mountPath: /credentials
              - name: credential
                mountPath: /var/run/credentials
              - name: trusted-ca
                mountPath: /etc/pki/ca-trust/extracted/pem
                readOnly: true
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: PROVIDER
                value: $(params.provider)
              - name: E2E_NAMESPACE
                value: $(params.namespace)
              - name: ARTIFACT_DIR
                value: "/workspace/konflux-artifacts"
              - name: GIT_REVISION
                value: "$(steps.extract-commit.results.commit)"
              - name: KUBECONFIG
                value: "/credentials/kubeconfig"
              - name: REQUESTS_CA_BUNDLE
                value: "/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem"
              - name: SSL_CERT_FILE
                value: "/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem"
            # Prebuilt oc/git/jq/python3; Tekton runs non-root so runtime dnf fails.
            image: quay.io/konflux-qe-incubator/konflux-qe-tools:latest
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              trap 'echo "error: pipeline step line $LINENO: command \"$BASH_COMMAND\" exited with status $?" >&2' ERR

              REVISION="${GIT_REVISION}"
              echo "Cloning lightspeed-agentic-sandbox@${REVISION}"

              SANDBOX_WORK="/workspace/sandbox"
              rm -rf "${SANDBOX_WORK}"
              git clone --depth=1 https://github.com/openshift/lightspeed-agentic-sandbox.git "${SANDBOX_WORK}"
              cd "${SANDBOX_WORK}"
              git fetch --depth=1 origin "${REVISION}"
              git checkout "${REVISION}"

              echo "Cloning lightspeed-agentic-operator for Result CRDs..."
              git clone --depth=1 https://github.com/openshift/lightspeed-agentic-operator.git /workspace/operator
              export OPERATOR_REPO=/workspace/operator

              mkdir -p "${ARTIFACT_DIR}"
              bash .tekton/integration-tests/scripts/run-sandbox-integration-tests.sh "${PROVIDER}"
          - name: gather-cluster-resources
            onError: continue
            volumeMounts:
              - name: cluster-credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/kubeconfig"
              - name: ARTIFACT_DIR
                value: "/workspace/konflux-artifacts"
              - name: NAMESPACE
                value: $(params.namespace)
            image: quay.io/konflux-qe-incubator/konflux-qe-tools:latest
            script: |
              #!/bin/bash
              set -x
              mkdir -p "${ARTIFACT_DIR}"
              cd "${ARTIFACT_DIR}"
              oc get jobs -n "${NAMESPACE}" -l agentic.openshift.io/component=sandbox-e2e -o yaml > batch-jobs.yaml 2>/dev/null || true
              oc get pods -n "${NAMESPACE}" -l agentic.openshift.io/component=sandbox-e2e -o yaml > batch-pods.yaml 2>/dev/null || true
              oc get pods -n "${NAMESPACE}" -l app=lightspeed-otel-collector -o yaml > otel-collector-pods.yaml 2>/dev/null || true
              oc get analysisresults -n "${NAMESPACE}" -o yaml > analysisresults.yaml 2>/dev/null || true
              oc get verificationresults -n "${NAMESPACE}" -o yaml > verificationresults.yaml 2>/dev/null || true
              oc get executionresults -n "${NAMESPACE}" -o yaml > executionresults.yaml 2>/dev/null || true
              oc get configmaps -n "${NAMESPACE}" -l e2e.openshift.io/session -o yaml > e2e-configmaps.yaml 2>/dev/null || true
              oc get events -n "${NAMESPACE}" --sort-by=.lastTimestamp \
                > events.txt 2>/dev/null || true
              oc logs -n "${NAMESPACE}" \
                -l agentic.openshift.io/component=sandbox-e2e \
                --all-containers=true --prefix --tail=1000 \
                > batch-pod-logs.txt 2>/dev/null || true
              : > otel-collector-logs.txt
              for pod in $(oc get pods -n "${NAMESPACE}" \
                -l app=lightspeed-otel-collector -o name 2>/dev/null || true); do
                echo "=== ${pod} ===" >> otel-collector-logs.txt
                oc logs -n "${NAMESPACE}" "${pod}" \
                  --all-containers=true --prefix --timestamps --tail=-1 \
                  >> otel-collector-logs.txt 2>/dev/null || true
              done
              echo "Artifacts gathered:"
              ls -la "${ARTIFACT_DIR}" || true
          - name: list-artifacts
            onError: continue
            image: quay.io/konflux-qe-incubator/konflux-qe-tools:latest
            workingDir: /workspace/konflux-artifacts
            script: |
              #!/bin/bash
              echo "=== Artifacts to push ==="
              ls -la /workspace/konflux-artifacts || true
          - name: push-artifacts
            onError: continue
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/secure-push-oci/0.1/secure-push-oci.yaml
            params:
              - name: workdir-path
                value: /workspace/konflux-artifacts
              - name: oci-ref
                value: "quay.io/openshift-lightspeed/ols-operator-artifacts:$(steps.extract-commit.results.artifact-tag)"
              - name: credentials-volume-name
                value: ols-konflux-artifacts-bot-creds
          - name: fail-if-any-step-failed
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/fail-if-any-step-failed/0.1/fail-if-any-step-failed.yaml
  finally:
    - name: export-logs-for-retention
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/export-logs/0.1/export-logs-to-quay.yaml
      params:
        - name: pipeline-run-name
          value: $(context.pipelineRun.name)
        - name: namespace
          value: $(context.pipelineRun.namespace)
        - name: quay-repo
          value: "quay.io/openshift-lightspeed/ols-operator-artifacts"
        - name: artifact-credentials-secret
          value: ols-konflux-artifacts-bot
